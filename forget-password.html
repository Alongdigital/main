
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password | AlongDigital</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }


    body {
      min-height: 100vh;
      background: #f4f6fa;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: #102b50;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #fff;
      font-size: 23px;
      font-weight: bold;
      text-decoration: none;
    }

    .logo span {
      color: #d5a23b;
    }

    .home-link {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
    }

    .main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 35px 15px;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 38px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 30px rgba(16, 43, 80, 0.10);
    }

    .icon {
      width: 65px;
      height: 65px;
      background: #fff5df;
      color: #d5a23b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      margin: 0 auto 20px;
    }

    .heading {
      text-align: center;
      margin-bottom: 28px;
    }

    .heading h1 {
      color: #102b50;
      font-size: 26px;
      margin-bottom: 12px;
    }

    .heading p {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 22px;
    }

    .form-group label {
      display: block;
      color: #26384d;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .form-group input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d8dee8;
      border-radius: 9px;
      outline: none;
      font-size: 14px;
    }

    .form-group input:focus {
      border-color: #d5a23b;
      box-shadow: 0 0 0 3px rgba(213, 162, 59, 0.12);
    }

    .reset-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #102b50;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .reset-btn:hover {
      background: #d5a23b;
      color: #102b50;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: #102b50;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    footer {
      text-align: center;
      padding: 17px;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .reset-card {
        padding: 32px 22px;
      }

      .heading h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <nav class="navbar">
    <a href="../index.html" class="logo">
      Along<span>Digital</span>
    </a>

    <a href="../index.html" class="home-link">Home</a>
  </nav>

  <main class="main">

    <section class="reset-card">

      <div class="icon">↻</div>

      <div class="heading">
        <h1>Forgot Password?</h1>
        <p>
          Enter your registered email address.
          We'll help you reset your password securely.
        </p>
      </div>

      <form id="forgotPasswordForm">

        <div class="form-group">
          <label for="email">Registered Email Address</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your registered email"
            required
          >
        </div>

        <button type="submit" class="reset-btn">
          Send Reset Link
        </button>

      </form>

      <a href="login.html" class="back-link">
        ← Back to Login
      </a>

    </section>

  </main>

  <footer>
    © 2026 AlongDigital. All Rights Reserved.
  </footer>

  <script type="module" src="auth.js"></script>


</body>
</html>
