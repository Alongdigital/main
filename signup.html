
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b50">

  <title>Create Account | AlongDigital</title>
<style>

/* =====================================
   ALONGDIGITAL - SIGNUP STYLESHEET
===================================== */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  min-height: 100vh;
  background: #f2f5fa;
  display: flex;
  flex-direction: column;
  color: #243247;
}

/* NAVBAR */

.navbar {
  width: 100%;
  padding: 17px 7%;
  background: #102b50;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  text-decoration: none;
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 11px;
  background: #d5a23b;
  color: #102b50;
  display: grid;
  place-items: center;
  font-size: 18px;
  font-weight: 900;
}

.brand-name {
  color: white;
  font-size: 17px;
  font-weight: bold;
  letter-spacing: 1px;
}

.brand-subtitle {
  color: #c4d2e4;
  font-size: 9px;
  letter-spacing: 2px;
  margin-top: 4px;
}

.home-link {
  color: white;
  text-decoration: none;
  font-size: 13px;
}

/* MAIN */

.main {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 45px 16px;
}

/* SIGNUP CARD */

.signup-card {
  width: 100%;
  max-width: 470px;
  background: white;
  border-radius: 18px;
  padding: 35px;
  box-shadow: 0 12px 40px rgba(16, 43, 80, .09);
}

/* HEADING */

.heading {
  text-align: center;
  margin-bottom: 28px;
}

.heading-icon {
  width: 55px;
  height: 55px;
  border-radius: 15px;
  margin: 0 auto 15px;
  background: #fff5df;
  color: #b78628;
  display: grid;
  place-items: center;
  font-size: 25px;
  font-weight: bold;
}

.heading h1 {
  color: #102b50;
  font-size: 25px;
  margin-bottom: 9px;
}

.heading p {
  color: #8490a0;
  font-size: 12px;
  line-height: 1.6;
}

/* FORM */

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 12px;
  font-weight: bold;
  color: #40516a;
  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  height: 47px;
  border: 1px solid #dce3ec;
  border-radius: 9px;
  padding: 0 14px;
  outline: none;
  background: #fbfcfe;
  color: #243247;
  font-size: 13px;
  transition: .2s;
}

.form-group input:focus {
  border-color: #1b4a78;
  background: white;
  box-shadow: 0 0 0 3px rgba(27, 74, 120, .08);
}

/* PASSWORD */

.password-wrap {
  position: relative;
}

.password-wrap input {
  padding-right: 65px;
}

.show-password {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: transparent;
  color: #31577d;
  font-size: 11px;
  font-weight: bold;
  cursor: pointer;
}

/* TERMS */

.terms {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  margin: 21px 0;
  font-size: 11px;
  color: #64748b;
  line-height: 1.7;
  cursor: pointer;
}

.terms input {
  margin-top: 3px;
  accent-color: #102b50;
}

.terms a {
  color: #174c80;
  text-decoration: none;
  font-weight: bold;
}

/* SUBMIT BUTTON */

.signup-btn {
  width: 100%;
  height: 49px;
  border: none;
  border-radius: 9px;
  background: linear-gradient(110deg, #102b50, #1c4775);
  color: white;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

.signup-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 7px 18px rgba(16, 43, 80, .2);
}

.signup-btn:active {
  transform: scale(.98);
}

/* DIVIDER */

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 23px 0;
  color: #a0aaba;
  font-size: 11px;
}

.divider::before,
.divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: #e8edf3;
}

/* LOGIN LINK */

.login-text {
  text-align: center;
  font-size: 12px;
  color: #7b8798;
}

.login-text a {
  color: #174c80;
  font-weight: bold;
  text-decoration: none;
}

/* FOOTER */

.footer {
  text-align: center;
  padding: 18px;
  font-size: 10px;
  color: #8b97a7;
}

.footer strong {
  color: #102b50;
}

/* RESPONSIVE */

@media (max-width: 480px) {

  .navbar {
    padding: 14px 17px;
  }

  .brand-name {
    font-size: 15px;
  }

  .signup-card {
    padding: 27px 20px;
  }

  .heading h1 {
    font-size: 22px;
  }

}

  </style>
</head>

<body>

  <header class="navbar">

    <a href="../index.html" class="brand">
      <div class="logo">AD</div>

      <div>
        <div class="brand-name">ALONGDIGITAL</div>
        <div class="brand-subtitle">DIGITAL SOLUTIONS</div>
      </div>
    </a>

    <a href="../index.html" class="home-link">
      ← Home
    </a>

  </header>

  <main class="main">

    <section class="signup-card">

      <div class="heading">

        <div class="heading-icon">+</div>

        <h1>Create Account</h1>

        <p>
          Join AlongDigital and create your personal account
          to access our digital services.
        </p>

      </div>

      <form id="signupForm">

        <div class="form-group">
          <label for="fullName">Full Name *</label>

          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            maxlength="80"
            autocomplete="name"
            required
          >
        </div>

        <div class="form-group">
          <label for="email">Email Address *</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="mobile">Mobile Number</label>

          <input
            type="tel"
            id="mobile"
            name="mobile"
            placeholder="Enter 10-digit mobile number"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel-national"
          >
        </div>

        <div class="form-group">

          <label for="password">Create Password *</label>

          <div class="password-wrap">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a strong password"
              minlength="8"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="show-password"
              data-target="password"
            >
              Show
            </button>

          </div>

        </div>

        <div class="form-group">

          <label for="confirmPassword">Confirm Password *</label>

          <div class="password-wrap">

            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Enter password again"
              minlength="8"
              autocomplete="new-password"
              required
            >

            <button
              type="button"
              class="show-password"
              data-target="confirmPassword"
            >
              Show
            </button>

          </div>

        </div>

        <label class="terms">

          <input
            type="checkbox"
            id="termsAccepted"
            name="termsAccepted"
            required
          >

          <span>
            I agree to the
            <a
              href="../terms.html"
              target="_blank"
              rel="noopener noreferrer"
            >
              Terms & Conditions
            </a>
            and Privacy Policy.
          </span>

        </label>

        <button type="submit" class="signup-btn">
          Create My Account →
        </button>

      </form>

      <div class="divider">OR</div>

      <p class="login-text">
        Already have an account?
        <a href="login.html">Login here</a>
      </p>

    </section>

  </main>

  <footer class="footer">
    <strong>ALONGDIGITAL</strong><br>
    © 2026 AlongDigital. All Rights Reserved.
  </footer>

<script type="module" src="auth.js"></script>

</body>
</html>
